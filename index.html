<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiHelpThai 60/40 v14</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#efefef;margin:0;padding:20px;color:#222}
.box{max-width:720px;margin:auto;background:#f7f7f7;border-radius:28px;padding:20px}
.tabs{display:flex;gap:14px;margin-bottom:18px}
.tab{flex:1;border:none;border-radius:22px;padding:18px;font-size:20px;font-weight:700}
.active{background:#3b82f6;color:white}
.inactive{background:#dfe1e5;color:#1d4ed8}
.page{display:none}
.show{display:block}
h1{text-align:center;font-size:34px;margin:10px 0}
.sub{text-align:center;color:#666;font-size:16px;margin-bottom:25px}
label{font-size:24px;font-weight:700;display:block;margin-bottom:10px}
input{width:100%;box-sizing:border-box;padding:22px;border:4px solid #cfcfcf;border-radius:24px;font-size:34px;margin-bottom:14px}
.btn{width:100%;border:none;border-radius:22px;padding:20px;font-size:26px;font-weight:700;margin:14px 0}
.bluebtn{background:#3b82f6;color:white}
.graybtn{background:#999;color:white}
.card{border-radius:26px;padding:24px;margin:16px 0}
.blue{background:#e9f2ff}
.green{background:#eaf6ea}
.title{font-size:26px;font-weight:700}
.value{font-size:56px;font-weight:800;margin-top:10px}
.note{border-radius:18px;padding:16px;margin-top:14px;font-size:18px;line-height:1.5}
.red{background:#ffe8e8;border:3px solid #ef5a5a;color:#b00020}
.yellow{background:#fff5d9;border:3px solid #e7b800}
.item{background:white;border:3px solid #ddd;border-radius:22px;padding:18px;margin-top:14px}
.del{border:none;background:#ffe5e5;color:#b00020;border-radius:14px;padding:10px 14px;font-size:18px;margin-top:10px}
.daybtn{background:#eef4ff;border:none;padding:10px 14px;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div class="box">

<div class="tabs">
<button id="dtab" class="tab active" onclick="showPage('daily')">รายวัน</button>
<button id="mtab" class="tab inactive" onclick="showPage('month')">รายเดือน</button>
</div>

<div id="daily" class="page show">
<h1>คำนวณรายวัน</h1>
<div class="sub">กรอกยอดซื้อ แล้วเพิ่มรายการวันนี้</div>

<label>ยอดซื้อทั้งหมด (บาท)</label>
<input id="amount" inputmode="decimal">
<div id="inputwarn"></div>

<button class="btn bluebtn" onclick="saveItem()">เพิ่มรายการวันนี้</button>

<div class="card blue">
<div class="title">รัฐช่วย 60%</div>
<div id="gov" class="value">0.00 บาท</div>
<div id="govwarn"></div>
</div>

<div class="card green">
<div class="title">ประชาชนจ่าย 40%</div>
<div id="user" class="value">0.00 บาท</div>
<div id="userwarn"></div>
</div>

<div class="card blue">
<div class="title">ยังซื้อแบบ 60/40 ได้อีกวันนี้</div>
<div id="dailyremain" class="value" style="font-size:46px">333.33 บาท</div>
<div id="dailyremainnote" style="font-size:22px"></div>
</div>

<div class="card blue">
<div class="title">สิทธิ์รัฐคงเหลือเดือนนี้</div>
<div id="monthremain" class="value" style="font-size:46px">1,000.00 บาท</div>
<div id="monthwarn"></div>
</div>

<div id="todaylist"></div>
</div>

<div id="month" class="page">
<h1>สิทธิ์รายเดือน</h1>
<div id="monthlist"></div>
<button class="btn graybtn" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>
</div>

</div>

<script>
const DAILY_CAP=200;
const MONTH_CAP=1000;

function fmt(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function getItems(){return JSON.parse(localStorage.getItem('items')||'[]')}
function saveItems(a){localStorage.setItem('items',JSON.stringify(a))}
function todayKey(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})}
function nowThai(){
return new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'medium',timeStyle:'short'});
}
function monthUsed(){return getItems().reduce((a,b)=>a+(b.gov||0),0)}
function todayUsed(){return getItems().filter(x=>x.day===todayKey()).reduce((a,b)=>a+(b.gov||0),0)}

function calc(){
let total=parseFloat(document.getElementById('amount').value)||0;
let inputwarn=document.getElementById('inputwarn');
let govwarn=document.getElementById('govwarn');
let userwarn=document.getElementById('userwarn');

inputwarn.innerHTML=''; govwarn.innerHTML=''; userwarn.innerHTML='';

if(total<=0){
gov.innerHTML='0.00 บาท';
user.innerHTML='0.00 บาท';
renderRemain();
return;
}

let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());
let gov60=total*0.6;
let govReal=Math.min(gov60,tr,mr);
let userReal=total-govReal;

gov.innerHTML=fmt(govReal)+' บาท';
user.innerHTML=fmt(userReal)+' บาท';

if(total>333.33){
inputwarn.innerHTML='<div class="note red">❗ ยอดซื้อเกิน 333.33 บาท<br>รัฐช่วยได้สูงสุด 200 บาท / วัน</div>';
}

if(gov60>govReal){
govwarn.innerHTML='<div class="note yellow">⚠️ รัฐช่วยได้ตามสิทธิ์คงเหลือเท่านั้น<br>รัฐช่วยได้สูงสุด 200 บาท / วัน</div>';
}

if(total>333.33){
let over=total-333.33;
let p=(userReal/total)*100;
userwarn.innerHTML='<div class="note yellow">ยอดซื้อเกิน 333.33 บาท อยู่ '+fmt(over)+' บาท<br><br>ประชาชนจ่าย 133.33 บาท (40% เดิม)<br>+ จ่ายเพิ่มจากยอดเกิน '+fmt(over)+' บาท<br><br>รวมจ่ายจริง '+fmt(userReal)+' บาท ('+fmt(p)+'%)</div>';
}

renderRemain();
}

function renderRemain(){
let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());

dailyremain.innerHTML='ซื้อได้อีก '+fmt(tr/0.6)+' บาท';
dailyremainnote.innerHTML='(รัฐช่วย '+fmt(tr)+' : ประชาชน '+fmt((tr/0.6)*0.4)+')';

monthremain.innerHTML=fmt(mr)+' บาท';
let buy=mr/0.6;
monthwarn.innerHTML='ยังซื้อรวมแบบ 60/40 ได้อีก (ยอดซื้อรวม) '+fmt(buy)+' บาท<br>(รัฐช่วย '+fmt(mr)+' : ประชาชน '+fmt(buy*0.4)+')';

if(mr<=200 && mr>0){
monthwarn.innerHTML+='<div class="note yellow">⚠️ เหลือสิทธิ์รัฐเดือนนี้ '+fmt(mr)+' บาท</div>';
}
if(mr<=0){
monthwarn.innerHTML='<div class="note red">❗ ใช้สิทธิ์เดือนนี้ครบแล้ว</div>';
}
}

function saveItem(){
let total=parseFloat(amount.value);
if(!total||total<=0)return;

let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());
let gov=Math.min(total*0.6,tr,mr);
let user=total-gov;

let arr=getItems();
arr.push({
day:todayKey(),
time:nowThai(),
total:total,
gov:gov,
user:user
});
saveItems(arr);
amount.value='';
renderAll();
calc();
}

function renderToday(){
let arr=getItems().filter(x=>x.day===todayKey());
todaylist.innerHTML='<h2 style="margin-top:30px">รายการวันนี้</h2>';
if(arr.length===0){todaylist.innerHTML+='<div class="item">ยังไม่มีรายการ</div>';return;}
arr.forEach((x,i)=>{
todaylist.innerHTML+=`
<div class="item">
<div style="font-size:24px;font-weight:800">${x.time}</div>
<div>ยอดซื้อ ${fmt(x.total)}</div>
<div>รัฐ ${fmt(x.gov)} : ประชาชน ${fmt(x.user)}</div>
<button class="del" onclick="deleteItem(${getItems().findIndex(a=>a.time===x.time&&a.total===x.total)})">🗑 ลบรายการ</button>
</div>`;
});
}

function renderMonth(){
let arr=getItems();
if(arr.length===0){monthlist.innerHTML='ยังไม่มีรายการ';return;}
let groups={};
arr.forEach((x,i)=>{
if(!groups[x.day])groups[x.day]=[];
groups[x.day].push({...x,index:i});
});
monthlist.innerHTML='';
Object.keys(groups).forEach((d,idx)=>{
let g=groups[d];
let total=g.reduce((a,b)=>a+b.total,0);
let gov=g.reduce((a,b)=>a+b.gov,0);
let user=g.reduce((a,b)=>a+b.user,0);
monthlist.innerHTML+=`
<div class="item">
<div style="font-size:24px;font-weight:800">${d}</div>
<div>ยอดซื้อรวม ${fmt(total)} บาท</div>
<div>รัฐช่วยรวม ${fmt(gov)} : ประชาชนรวม ${fmt(user)}</div>
<button class="daybtn" onclick="toggleDay(${idx})">ดูรายการวันนี้ (${g.length} รายการ)</button>
<div id="day${idx}" style="display:none;margin-top:10px">
${g.map(x=>`
<div style="border-top:1px solid #ddd;margin-top:8px;padding-top:8px">
<div><b>${x.time}</b></div>
<div>ยอดซื้อ ${fmt(x.total)}</div>
<div>รัฐ ${fmt(x.gov)} : ประชาชน ${fmt(x.user)}</div>
<button class="del" onclick="deleteItem(${x.index})">🗑 ลบรายการ</button>
</div>`).join('')}
</div></div>`;
});
}

function toggleDay(i){
let e=document.getElementById('day'+i);
e.style.display=e.style.display==='none'?'block':'none';
}

function deleteItem(i){
let arr=getItems();
arr.splice(i,1);
saveItems(arr);
renderAll();
calc();
}

function clearAll(){
if(confirm('ล้างข้อมูลทั้งหมด?')){
localStorage.removeItem('items');
renderAll();
calc();
}
}

function renderAll(){
renderToday();
renderMonth();
renderRemain();
}

function showPage(p){
daily.classList.remove('show');
month.classList.remove('show');
document.getElementById(p).classList.add('show');
dtab.className='tab inactive';
mtab.className='tab inactive';
if(p==='daily') dtab.className='tab active';
if(p==='month') mtab.className='tab active';
}

document.getElementById('amount').addEventListener('input',calc);
renderAll();
calc();
</script>
</body>
</html>
