<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ไทยช่วยไทย</title>
<style>
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;margin:0;padding:16px;color:#222;}
.box{max-width:520px;margin:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{flex:1;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;}
.active{background:#2f80ed;color:#fff;}
.inactive{background:#e5e7eb;}
.page{display:none}.show{display:block}
h1{font-size:22px;text-align:center;margin:0 0 6px}
.sub{font-size:14px;text-align:center;color:#666;margin-bottom:16px}
label{font-size:17px;font-weight:700;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:26px;border:2px solid #ccc;border-radius:16px}
.card{margin-top:14px;padding:18px;border-radius:18px}
.blue{background:#eaf4ff}
.green{background:#eef9ef}
.title{font-size:17px;font-weight:700}
.value{font-size:30px;font-weight:800;margin-top:6px}
.note{margin-top:10px;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.red{background:#ffe5e5;border:1px solid #eb5757}
.yellow{background:#fff7d6;border:1px solid #e0b400}
.btn{width:100%;padding:16px;border:none;border-radius:14px;margin-top:14px;font-size:18px;font-weight:700}
.bluebtn{background:#2f80ed;color:white}
.graybtn{background:#888;color:white}
.item{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.del{margin-top:8px;border:none;background:#ffe5e5;color:#b00020;padding:8px 10px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div class="box">

<div class="tabs">
<button id="dtab" class="tab active" onclick="showPage('daily')">รายวัน</button>
<button id="mtab" class="tab inactive" onclick="showPage('month')">รายเดือน</button>
</div>

<div id="daily" class="page show">
<h1>คำนวณรายวัน</h1>
<div class="sub">กรอกยอดซื้อ แล้วเพิ่มรายการวันนี้</div>

<label>ยอดซื้อทั้งหมด (บาท)</label>
<input id="amount" inputmode="decimal">
<div id="inputwarn" class="note red" style="display:none"></div>

<div class="card blue">
<div class="title">รัฐช่วย 60%</div>
<div id="gov" class="value">0.00 บาท</div>
<div id="govwarn"></div>
</div>

<div class="card green">
<div class="title">ประชาชนจ่าย 40%</div>
<div id="user" class="value">0.00 บาท</div>
<div id="userwarn"></div>
</div>

<div class="card blue">
<div class="title">สิทธิ์รายวันคงเหลือ</div>
<div id="dailyremain" class="value">333.33 บาท</div>
<div id="dailyremainnote" style="font-size:14px;margin-top:6px"></div>
</div>

<div class="card blue">
<div class="title">สิทธิ์รายเดือนคงเหลือ</div>
<div id="monthremain" class="value">1,000.00 บาท</div>
<div id="monthwarn"></div>
</div>

<button class="btn bluebtn" onclick="saveItem()">เพิ่มรายการวันนี้</button>

<div class="card">
<div class="title">รายการวันนี้</div>
<div id="todaylist"></div>
</div>
</div>

<div id="month" class="page">
<h1>สิทธิ์รายเดือน</h1>
<div id="monthlist"></div>
<button class="btn graybtn" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>
</div>

</div>

<script>
const DAILY_CAP=200;
const MONTH_CAP=1000;

function fmt(n){return Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}

function thaiNow(){
return new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function getItems(){return JSON.parse(localStorage.getItem('items')||'[]')}
function saveItems(a){localStorage.setItem('items',JSON.stringify(a))}

function todayKey(){
return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
}

function getMonthUsed(){
return getItems().reduce((a,b)=>a+b.gov,0)
}

function getTodayUsed(){
return getItems().filter(x=>x.day===todayKey()).reduce((a,b)=>a+b.gov,0)
}

function calc(){
let total=parseFloat(amount.value);
inputwarn.style.display='none';
govwarn.innerHTML='';
userwarn.innerHTML='';
monthwarn.innerHTML='';

if(isNaN(total)||total<=0){
gov.textContent='0.00 บาท';
user.textContent='0.00 บาท';
return;
}

let todayRemain=Math.max(0,DAILY_CAP-getTodayUsed());
let monthRemain=Math.max(0,MONTH_CAP-getMonthUsed());

let gov60=total*0.6;
let govReal=Math.min(gov60,todayRemain,monthRemain);
let userReal=total-govReal;

gov.textContent=fmt(govReal)+' บาท';
user.textContent=fmt(userReal)+' บาท';

if(total>333.33){
inputwarn.innerHTML='❗ ยอดซื้อเกิน 333.33 บาท';
inputwarn.style.display='block';
}

if(gov60>govReal){
govwarn.innerHTML='<div class="note yellow">⚠️ รัฐช่วยได้ตามสิทธิ์คงเหลือเท่านั้น</div>';
}

let over=total-333.33;
if(over>0){
let p=(userReal/total)*100;
userwarn.innerHTML='<div class="note yellow">40% เดิม 133.33 + ส่วนเกิน '+fmt(over)+'<br>รวมประชาชนจ่าย '+fmt(userReal)+' ('+fmt(p)+'%)</div>';
}

renderRemain();
}

function renderRemain(){
let todayRemain=Math.max(0,DAILY_CAP-getTodayUsed());
let monthRemain=Math.max(0,MONTH_CAP-getMonthUsed());

let totalBuyRemain=todayRemain/0.6;
let userPart=totalBuyRemain*0.4;

dailyremain.textContent=fmt(totalBuyRemain)+' บาท';
dailyremainnote.innerHTML='(รัฐ '+fmt(todayRemain)+' : ประชาชน '+fmt(userPart)+')';

monthremain.textContent=fmt(monthRemain)+' บาท';

if(monthRemain<=200 && monthRemain>0){
monthwarn.innerHTML='<div class="note yellow">⚠️ เหลือสิทธิ์เดือนนี้ '+fmt(monthRemain)+' บาท</div>';
}
if(monthRemain<=0){
monthwarn.innerHTML='<div class="note red">❗ ใช้สิทธิ์เดือนนี้ครบแล้ว</div>';
}
}

function saveItem(){
let total=parseFloat(amount.value);
if(isNaN(total)||total<=0){alert('กรุณากรอกยอด');return}

let todayRemain=Math.max(0,DAILY_CAP-getTodayUsed());
let monthRemain=Math.max(0,MONTH_CAP-getMonthUsed());
let gov=Math.min(total*0.6,todayRemain,monthRemain);
let user=total-gov;

if(!confirm('เพิ่มรายการวันนี้หรือไม่?')) return;

let arr=getItems();
arr.push({
total:total,
gov:gov,
user:user,
time:thaiNow(),
day:todayKey()
});
saveItems(arr);

renderAll();
amount.value='';
calc();
}

function deleteItem(i){
if(confirm('ลบรายการนี้?')){
let arr=getItems();
arr.splice(i,1);
saveItems(arr);
renderAll();
calc();
}
}

function renderToday(){
let arr=getItems().filter(x=>x.day===todayKey());
if(arr.length===0){todaylist.innerHTML='ยังไม่มีรายการ';return}
todaylist.innerHTML=arr.map((x,i)=>`
<div class="item">
<div><b>${x.time}</b></div>
<div>ยอดซื้อ ${fmt(x.total)}</div>
<div>รัฐ ${fmt(x.gov)} : ประชาชน ${fmt(x.user)}</div>
<button class="del" onclick="deleteItem(${getItems().indexOf(x)})">🗑 ลบรายการ</button>
</div>`).join('');
}

function renderMonth(){
let arr=getItems();
if(arr.length===0){monthlist.innerHTML='ยังไม่มีรายการ';return}
monthlist.innerHTML=arr.map((x,i)=>`
<div class="item">
<div><b>${x.time}</b></div>
<div>ยอดซื้อ ${fmt(x.total)}</div>
<div>รัฐ ${fmt(x.gov)} : ประชาชน ${fmt(x.user)}</div>
<button class="del" onclick="deleteItem(${i})">🗑 ลบรายการ</button>
</div>`).join('');
}

function renderAll(){
renderToday();
renderMonth();
renderRemain();
}

function clearAll(){
if(confirm('ล้างข้อมูลทั้งหมด?')){
localStorage.removeItem('items');
renderAll();
calc();
}
}

function showPage(p){
daily.classList.remove('show');
month.classList.remove('show');
document.getElementById(p).classList.add('show');
dtab.className='tab inactive';
mtab.className='tab inactive';
if(p==='daily') dtab.className='tab active';
if(p==='month') mtab.className='tab active';
}

amount.addEventListener('input',calc);
renderAll();
calc();
</script>
</body>
</html>
