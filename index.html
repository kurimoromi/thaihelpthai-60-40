<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><style>html{-webkit-text-size-adjust:85%;}</style>
<title>ไทยช่วยไทย 60/40</title>
<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f6f8;
margin:0;
padding:16px;
color:#222;
}
.box{
max-width:520px;
margin:auto;
background:#fff;
border-radius:28px;
padding:26px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}
.tabs{
display:flex;
gap:12px;
margin-bottom:24px;
}
.tab{
flex:1;
padding:18px;
font-size:17px;
font-weight:700;
border:none;
border-radius:18px;
}
.active{
background:#2f80ed;
color:white;
}
.inactive{
background:#e5e7eb;
}
.page{display:none;}
.show{display:block;}

h1{
font-size:15px;
text-align:center;
margin:0;
}
.sub{
font-size:16px;
text-align:center;
color:#666;
margin:10px 0 26px;
}
label{
display:block;
font-size:17px;
font-weight:700;
margin-bottom:12px;
}
input{
width:100%;
box-sizing:border-box;
font-size:15px;
padding:16px;
border:3px solid #cfcfcf;
border-radius:22px;
}
.card{
margin-top:18px;
padding:24px;
border-radius:24px;
}
.state{
background:#eaf4ff;
}
.user{
background:#eef9ef;
}
.monthcard{
background:#f5f7fa;
}
.cardtitle{
font-size:17px;
font-weight:700;
}
.value{
font-size:30px;
font-weight:800;
margin-top:8px;
}
.warn{
margin-top:14px;
padding:18px;
border-radius:18px;
font-size:15px;
line-height:1.5;
display:none;
}
.yellow{
background:#fff3cd;
border:2px solid #f2c94c;
}
.orange{
background:#ffe8cc;
border:2px solid #f2994a;
}
.red{
background:#ffe5e5;
border:2px solid #eb5757;
}
.blueinfo{
margin-top:22px;
background:#eaf4ff;
border:2px solid #7ab7ff;
padding:18px;
border-radius:18px;
font-size:17px;
}
.btn{
width:100%;
padding:16px;
font-size:15px;
border:none;
border-radius:18px;
margin-top:18px;
font-weight:700;
}
.bluebtn{
background:#2f80ed;
color:white;
}
.graybtn{
background:#888;
color:white;
}
</style>
</head>
<body>

<div class="box">

<div class="tabs">
<button class="tab active" id="dailyTab" onclick="showPage('daily')">รายวัน</button>
<button class="tab inactive" id="monthTab" onclick="showPage('month')">รายเดือน</button>
</div>

<div id="daily" class="page show">
<h1>คำนวณรายวัน</h1>
<div class="sub">กรอกยอดเต็ม แล้วระบบจะแยกให้</div>

<label>ยอดซื้อทั้งหมด (บาท)</label>
<input id="amount" inputmode="decimal"><div class="warn red" id="inputwarn" style="display:none;margin-top:8px;padding:10px 14px;font-size:16px;line-height:1.4;"></div>

<div class="card state">
<div class="cardtitle">รัฐช่วย 60%</div>
<div class="value" id="gov">0.00 บาท</div>
<div class="warn yellow" id="govwarn"></div>
</div>

<div class="card user">
<div class="cardtitle">ประชาชนจ่าย 40%</div>
<div class="value" id="user">0.00 บาท</div>
<div class="warn orange" id="userwarn"></div>
</div>

<div class="warn red" id="monthfull"></div>
<div class="warn orange" id="highwarn"></div>

<div class="blueinfo">
ℹ️ ข้อมูลการใช้สิทธิ์เก็บในเครื่องนี้เท่านั้น
</div>

<button class="btn bluebtn" onclick="saveReal()">บันทึกยอดนี้เป็นการใช้สิทธิ์จริง</button>
</div>

<div id="month" class="page">
<h1>สิทธิ์รายเดือน</h1>

<div class="card state">
<div class="cardtitle">ใช้สิทธิ์รัฐเดือนนี้แล้ว</div>
<div class="value" id="used">0.00 บาท</div>
</div>

<div class="card user">
<div class="cardtitle">เหลือสิทธิ์รัฐเดือนนี้</div>
<div class="value" id="remain">1,000.00 บาท</div>
<div class="warn yellow" id="remainwarn"></div>
</div>


<div class="card monthcard">
<div class="cardtitle">ประวัติการใช้สิทธิ์เดือนนี้</div>
<div id="history" style="margin-top:14px;font-size:15px;"></div>
</div>
<button class="btn graybtn" onclick="clearMonth()">ล้างข้อมูลเดือนนี้</button>
</div>

</div>

<script>
const DAILY_CAP=200;
const MONTH_CAP=1000;

function fmt(n){
return Number(n).toLocaleString('th-TH',{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function showPage(page){
document.getElementById('daily').classList.remove('show');
document.getElementById('month').classList.remove('show');
document.getElementById(page).classList.add('show');

dailyTab.className='tab inactive';
monthTab.className='tab inactive';

if(page==='daily') dailyTab.className='tab active';
if(page==='month') monthTab.className='tab active';

renderMonth();
calc();
}

function getHistory(){
return JSON.parse(localStorage.getItem('monthHistory')||'[]');
}

function saveHistory(arr){
localStorage.setItem('monthHistory',JSON.stringify(arr));
}

function getUsed(){
return getHistory().reduce((a,b)=>a+b.gov,0);
}

function renderMonth(){
let used=getUsed();
let remain=Math.max(0,MONTH_CAP-used);

document.getElementById('used').textContent=fmt(used)+' บาท';
document.getElementById('remain').textContent=fmt(remain)+' บาท';

renderHistory();

let rw=document.getElementById('remainwarn');
rw.style.display='none';

if(remain<=200 && remain>0){
rw.innerHTML='⚠️ เหลือสิทธิ์รัฐเดือนนี้น้อยแล้ว';
rw.style.display='block';
}
if(remain<=0){
rw.innerHTML='⚠️ ใช้สิทธิ์รัฐครบ 1,000 บาท / เดือนแล้ว';
rw.style.display='block';
}
}


function renderHistory(){
let h=document.getElementById('history');
let arr=getHistory();

if(arr.length===0){
h.innerHTML='<div style="color:#666;">ยังไม่มีรายการ</div>';
return;
}

h.innerHTML=arr.map((x,i)=>`
<div style="background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:10px;">
<div><b>ยอดซื้อ ${fmt(x.total)} บาท</b></div>
<div>รัฐช่วย ${fmt(x.gov)} บาท</div>
<button onclick="deleteItem(${i})" style="margin-top:8px;border:none;background:#ffe5e5;color:#c00;padding:8px 12px;border-radius:10px;font-size:14px;">🗑 ลบรายการนี้</button>
</div>
`).join('');
}

function deleteItem(i){
if(confirm('ลบรายการนี้?')){
let arr=getHistory();
arr.splice(i,1);
saveHistory(arr);
renderMonth();
calc();
}
}

function calc(){
let total=parseFloat(document.getElementById('amount').value);
let gov=document.getElementById('gov');
let user=document.getElementById('user');
let govwarn=document.getElementById('govwarn');
let userwarn=document.getElementById('userwarn');
let highwarn=document.getElementById('highwarn');
let monthfull=document.getElementById('monthfull');
let inputwarn=document.getElementById('inputwarn');

govwarn.style.display='none';
userwarn.style.display='none';
highwarn.style.display='none';
monthfull.style.display='none';
inputwarn.style.display='none';

if(isNaN(total)||total<=0){
gov.textContent='0.00 บาท';
user.textContent='0.00 บาท';
return;
}

if(total>333.33){
inputwarn.innerHTML='❗ เกิน 333.33 บาท';
inputwarn.style.display='block';
}

if(total>10000){
highwarn.innerHTML='⚠️ ยอดค่อนข้างสูง กรุณาตรวจสอบอีกครั้ง';
highwarn.style.display='block';
}

let monthRemain=Math.max(0,MONTH_CAP-getUsed());

let gov60=total*0.6;
let govDaily=Math.min(gov60,DAILY_CAP);
let govFinal=Math.min(govDaily,monthRemain);
let userFinal=total-govFinal;

gov.textContent=fmt(govFinal)+' บาท';
user.textContent=fmt(userFinal)+' บาท';

if(gov60>DAILY_CAP){
let extra=gov60-DAILY_CAP;
let userPercent=(userFinal/total)*100;

govwarn.innerHTML='⚠️ รัฐช่วยได้สูงสุด 200 บาท / วัน';
govwarn.style.display='block';

let capBase = 333.33;
let overPurchase = total - capBase;

userwarn.innerHTML='⚠️ ยอดซื้อเกิน 333.33 บาท อยู่ '+fmt(overPurchase)+' บาท<br><br>ประชาชนจ่าย 133.33 บาท (40% เดิม)<br>+ จ่ายเพิ่มจากยอดเกิน '+fmt(overPurchase)+' บาท<br><br>รวมจ่ายจริง '+fmt(userFinal)+' บาท ('+fmt(userPercent)+'%)';
userwarn.style.display='block';
}

if(monthRemain<=0){
monthfull.innerHTML='⚠️ ใช้สิทธิ์รัฐครบ 1,000 บาท / เดือนแล้ว<br><br>ยอดนี้ประชาชนต้องจ่ายเต็ม';
monthfull.style.display='block';
}
}

document.getElementById('amount').addEventListener('input',calc);

function saveReal(){
let total=parseFloat(document.getElementById('amount').value);
if(isNaN(total)||total<=0){
alert('กรุณากรอกยอดซื้อ');
return;
}

let gov60=total*0.6;
let govFinal=Math.min(Math.min(gov60,DAILY_CAP),Math.max(0,MONTH_CAP-getUsed()));

if(!confirm('บันทึกยอดนี้เป็นการใช้สิทธิ์จริงหรือไม่?\n\nรัฐช่วย '+fmt(govFinal)+' บาท')){
return;
}

let arr=getHistory();
arr.push({
total: total,
gov: govFinal
});
saveHistory(arr);

let month=getUsed();
let remain=Math.max(0,MONTH_CAP-month);

alert('✅ บันทึกการใช้สิทธิ์แล้ว\n\nใช้แล้ว '+fmt(month)+' บาท\nเหลือ '+fmt(remain)+' บาท');

renderMonth();
calc();
}

function clearMonth(){
if(confirm('ล้างข้อมูลการใช้สิทธิ์เดือนนี้?')){
localStorage.removeItem('monthHistory');
renderMonth();
calc();
}
}

renderMonth();
calc();
</script>

</body>
</html>
