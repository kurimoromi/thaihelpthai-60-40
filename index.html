<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ไทยช่วยไทย 60/40</title>
<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f6f8;
margin:0;
padding:20px;
color:#222;
}
.box{
max-width:520px;
margin:auto;
background:#fff;
border-radius:28px;
padding:30px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}
h1{
font-size:34px;
text-align:center;
margin:0;
}
.sub{
font-size:20px;
text-align:center;
color:#666;
margin:10px 0 28px;
}
label{
display:block;
font-size:24px;
font-weight:700;
margin-bottom:12px;
}
input{
width:100%;
box-sizing:border-box;
font-size:38px;
padding:22px;
border:3px solid #cfcfcf;
border-radius:22px;
}
.cards{
margin-top:28px;
display:flex;
flex-direction:column;
gap:18px;
}
.card{
background:#f1f3f5;
border-radius:24px;
padding:24px;
}
.cardtitle{
font-size:24px;
color:#555;
}
.value{
font-size:48px;
font-weight:800;
margin-top:8px;
}
.warn{
margin-top:20px;
background:#fff3cd;
border:2px solid #f2c94c;
padding:20px;
border-radius:20px;
font-size:22px;
line-height:1.5;
display:none;
}
.month{
margin-top:28px;
background:#eef6ff;
padding:24px;
border-radius:24px;
}
.btn{
margin-top:18px;
width:100%;
padding:20px;
font-size:26px;
border:none;
border-radius:18px;
background:#2d7ef7;
color:white;
font-weight:700;
}
.clear{
background:#888;
}
.small{
font-size:20px;
color:#555;
margin-top:8px;
}
</style>
</head>
<body>

<div class="box">
<h1>คำนวณ 60 / 40</h1>
<div class="sub">กรอกยอดเต็ม แล้วระบบจะแยกให้</div>

<label>ยอดซื้อทั้งหมด (บาท)</label>
<input id="amount" inputmode="decimal" placeholder="เช่น 450">

<div class="cards">
<div class="card">
<div class="cardtitle">รัฐช่วย</div>
<div class="value" id="gov">0.00 บาท</div>
<div class="small" id="govnote"></div>
</div>

<div class="card">
<div class="cardtitle">ประชาชนจ่าย</div>
<div class="value" id="user">0.00 บาท</div>
<div class="small" id="usernote"></div>
</div>
</div>

<div class="warn" id="warn"></div>

<div class="month">
<div style="font-size:24px;font-weight:700;">ใช้สิทธิ์เดือนนี้แล้ว</div>
<div class="value" id="used">0.00 บาท</div>
<div class="small">จากโควต้ารัฐ 1,000 บาท / เดือน</div>

<button class="btn" onclick="saveReal()">บันทึกยอดนี้เป็นการใช้สิทธิ์จริง</button>
<button class="btn clear" onclick="clearMonth()">ล้างข้อมูลเดือนนี้</button>
</div>
</div>

<script>
const DAILY_CAP = 200;
const MONTH_CAP = 1000;

const amount = document.getElementById('amount');
const gov = document.getElementById('gov');
const user = document.getElementById('user');
const govnote = document.getElementById('govnote');
const usernote = document.getElementById('usernote');
const warn = document.getElementById('warn');
const used = document.getElementById('used');

function fmt(n){
return Number(n).toLocaleString('th-TH',{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function getMonthUsed(){
return Number(localStorage.getItem('monthUsed')||0);
}

function renderMonth(){
used.textContent = fmt(getMonthUsed()) + ' บาท';
}

function calc(){
let total = parseFloat(amount.value);

if(isNaN(total)){
gov.textContent='0.00 บาท';
user.textContent='0.00 บาท';
govnote.textContent='';
usernote.textContent='';
warn.style.display='none';
return;
}

let gov60 = total*0.6;
let govFinal = Math.min(gov60, DAILY_CAP);
let userFinal = total - govFinal;

gov.textContent = fmt(govFinal)+' บาท';
user.textContent = fmt(userFinal)+' บาท';

govnote.textContent='';
usernote.textContent='';
warn.style.display='none';

if(gov60 > DAILY_CAP){
let extra = gov60 - DAILY_CAP;
let userPercent = (userFinal/total)*100;

govnote.textContent='รัฐช่วยได้สูงสุด 200 บาท / วัน';
usernote.textContent=
'เกินโควต้ารัฐช่วย '+
fmt(extra)+' บาท • ประชาชนจ่ายจริง '+fmt(userPercent)+'%';

warn.innerHTML=
'⚠️ รัฐช่วยได้สูงสุด 200 บาท / วัน<br><br>'+
'ยอดนี้เกินโควต้ารัฐช่วย '+fmt(extra)+' บาท<br>'+
'ประชาชนต้องจ่ายเพิ่มจากส่วนเกิน และจ่ายจริงรวม '+fmt(userPercent)+'% ของยอดซื้อ';
warn.style.display='block';
}
}

function saveReal(){
let total=parseFloat(amount.value);
if(isNaN(total)) return;

let gov60=total*0.6;
let govFinal=Math.min(gov60,DAILY_CAP);

let month=getMonthUsed()+govFinal;
localStorage.setItem('monthUsed',month);
renderMonth();
alert('บันทึกการใช้สิทธิ์แล้ว');
}

function clearMonth(){
if(confirm('ล้างข้อมูลการใช้สิทธิ์เดือนนี้?')){
localStorage.removeItem('monthUsed');
renderMonth();
}
}

amount.addEventListener('input',calc);
renderMonth();
</script>

</body>
</html>
